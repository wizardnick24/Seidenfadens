<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Logo -->
    <header class="header">
        <img src="logo.png" alt="Logo" class="logo">
    </header>

    <!-- Scrolling Background Section -->
    <section class="hero">
        <div class="overlay"></div>
        <h1 class="hero-text">Welcome</h1>
    </section>

    <!-- Schedule Section -->
    <section class="content-section">
        <h2>Monthly Schedule</h2>
        <img src="schedule.png" alt="Schedule" class="schedule-img">
    </section>

    <!-- Employee of the Month -->
    <section class="content-section">
        <h2>Employee of the Month</h2>
        <img src="Employee.png" alt="Employee of the Month" class="employee-img">
    </section>

    <!-- Social Links -->
    <footer class="footer">
        <h3>Follow Us</h3>
        <div class="social-links">
            <a href="#" class="social-button" target="_blank">Instagram</a>
            <a href="#" class="social-button" target="_blank">Facebook</a>
        </div>
    </footer>

    <!-- Admin Area Placeholder -->
    <section class="admin">
        <h3>Admin Access</h3>
        <p>This section will allow secure image replacement once backend or GitHub API logic is added.</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
